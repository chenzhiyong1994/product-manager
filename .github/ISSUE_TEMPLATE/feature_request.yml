name: 规则或能力建议
description: 建议新的产品工作流、规则或评估用例
title: "[Proposal] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述当前工作流会在哪类真实场景中失败，而不只是描述想增加的功能。
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: 已脱敏示例
      description: 提供一个可以区分修改前后行为的输入或文档片段。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明适用条件、期望输出以及不应影响的场景。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除真实客户资料、内部链接、账号和凭据。
          required: true
